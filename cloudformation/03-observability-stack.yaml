AWSTemplateFormatVersion: '2010-09-09'
Description: AnyGroupLLC alarms/SNS and application-secret rotation using the existing LabRole. Rotation is activated after
  Oracle seeding.
Parameters:
  EnvironmentName:
    Type: String
    Default: anygroup-gp2
  CoreStackName:
    Type: String
    Default: anygroup-gp2-core
    Description: Name of the deployed Part 8/9 core CloudFormation stack.
  NotificationEmail:
    Type: String
    Default: ''
    Description: |
      Optional email address for SNS alarm notifications. If supplied, AWS sends a confirmation email that must be manually accepted before notifications are delivered.
  MinimumHealthyFrontendTargets:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 4
    Description: Expected minimum healthy frontend capacity.
  Target5xxThreshold:
    Type: Number
    Default: 1
    MinValue: 1
    Description: Target-generated 5XX responses in one minute before alarm.
  NetworkStackName:
    Type: String
    Default: anygroup-gp2-network
  LabRoleName:
    Type: String
    Default: LabRole
    Description: Existing role with Lambda trust, VPC ENI, secret rotation, S3 read and logging permissions; no role is created.
  BackendRotationCodeKey:
    Type: String
    Default: ''
    AllowedPattern: ^$|rotation/[a-f0-9]{64}\.zip
    Description: Immutable Lambda ZIP key in the core bucket. Empty disables rotation during initial foundation deployment.
  BackendRotationDays:
    Type: Number
    Default: 30
    AllowedValues:
    - 7
    - 30
    - 60
    - 90
    Description: Application-password rotation interval in days.
Conditions:
  HasNotificationEmail:
    Fn::Not:
    - Fn::Equals:
      - Ref: NotificationEmail
      - ''
  HasBackendRotationCode:
    Fn::Not:
    - Fn::Equals:
      - Ref: BackendRotationCodeKey
      - ''
Resources:
  OperationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName:
        Fn::Sub: ${EnvironmentName}-operations
      DisplayName: AnyGroup GP2 Operations
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${EnvironmentName}-operations
      - Key: Project
        Value: INFOSYS735-GP2
      - Key: Environment
        Value: LearnerLab
      - Key: ManagedBy
        Value: CloudFormation
      - Key: Component
        Value: Observability
  OperationsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn:
        Ref: OperationsTopic
      Protocol: email
      Endpoint:
        Ref: NotificationEmail
  FrontendUnhealthyHostAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: ${EnvironmentName}-frontend-unhealthy-target
      AlarmDescription: |
        Alarm when one or more frontend ALB targets are unhealthy. Used as Reliability and Operational Excellence evidence during controlled tests.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
      - Name: LoadBalancer
        Value:
          Fn::ImportValue:
            Fn::Sub: ${CoreStackName}-AlbFullName
      - Name: TargetGroup
        Value:
          Fn::ImportValue:
            Fn::Sub: ${CoreStackName}-FrontendTargetGroupFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: OperationsTopic
      OKActions:
      - Ref: OperationsTopic
      Tags:
      - Key: Project
        Value: INFOSYS735-GP2
      - Key: ManagedBy
        Value: CloudFormation
  FrontendInServiceCapacityAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: ${EnvironmentName}-frontend-capacity-below-minimum
      AlarmDescription: |
        Alarm when frontend Auto Scaling in-service capacity is below the expected baseline. The ASG should normally maintain at least two frontend instances.
      Namespace: AWS/AutoScaling
      MetricName: GroupInServiceInstances
      Dimensions:
      - Name: AutoScalingGroupName
        Value:
          Fn::ImportValue:
            Fn::Sub: ${CoreStackName}-FrontendAutoScalingGroupName
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold:
        Ref: MinimumHealthyFrontendTargets
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
      - Ref: OperationsTopic
      OKActions:
      - Ref: OperationsTopic
      Tags:
      - Key: Project
        Value: INFOSYS735-GP2
      - Key: ManagedBy
        Value: CloudFormation
  AlbTarget5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: ${EnvironmentName}-alb-target-5xx
      AlarmDescription: |
        Alarm when targets behind the ALB return one or more HTTP 5XX responses during a one-minute period.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
      - Name: LoadBalancer
        Value:
          Fn::ImportValue:
            Fn::Sub: ${CoreStackName}-AlbFullName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold:
        Ref: Target5xxThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: OperationsTopic
      OKActions:
      - Ref: OperationsTopic
      Tags:
      - Key: Project
        Value: INFOSYS735-GP2
      - Key: ManagedBy
        Value: CloudFormation
  BackendUnhealthyHostAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: ${EnvironmentName}-backend-unhealthy-target
      AlarmDescription: Alarm when one or more backend targets behind the internal ALB are unhealthy.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
      - Name: LoadBalancer
        Value:
          Fn::ImportValue:
            Fn::Sub: ${CoreStackName}-InternalAlbFullName
      - Name: TargetGroup
        Value:
          Fn::ImportValue:
            Fn::Sub: ${CoreStackName}-BackendTargetGroupFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: OperationsTopic
      OKActions:
      - Ref: OperationsTopic
      Tags:
      - Key: Project
        Value: INFOSYS735-GP2
      - Key: Environment
        Value: LearnerLab
      - Key: ManagedBy
        Value: CloudFormation
      - Key: Component
        Value: Observability
  BackendInServiceCapacityAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: ${EnvironmentName}-backend-capacity-below-two
      AlarmDescription: Alarm when the two-node legacy backend ASG has fewer than two in-service instances.
      Namespace: AWS/AutoScaling
      MetricName: GroupInServiceInstances
      Dimensions:
      - Name: AutoScalingGroupName
        Value:
          Fn::ImportValue:
            Fn::Sub: ${CoreStackName}-BackendAutoScalingGroupName
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 2
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
      - Ref: OperationsTopic
      OKActions:
      - Ref: OperationsTopic
      Tags:
      - Key: Project
        Value: INFOSYS735-GP2
      - Key: Environment
        Value: LearnerLab
      - Key: ManagedBy
        Value: CloudFormation
      - Key: Component
        Value: Observability
  DatabaseCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: ${EnvironmentName}-databasecpualarm
      AlarmDescription: Oracle CPU remains above 80 percent
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
      - Name: DBInstanceIdentifier
        Value:
          Fn::ImportValue:
            Fn::Sub: ${CoreStackName}-DatabaseInstanceIdentifier
      Statistic: Average
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: OperationsTopic
      OKActions:
      - Ref: OperationsTopic
      Tags:
      - Key: Project
        Value: INFOSYS735-GP2
      - Key: ManagedBy
        Value: CloudFormation
  DatabaseFreeStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: ${EnvironmentName}-databasefreestoragealarm
      AlarmDescription: Oracle free storage is below 1 GiB
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
      - Name: DBInstanceIdentifier
        Value:
          Fn::ImportValue:
            Fn::Sub: ${CoreStackName}-DatabaseInstanceIdentifier
      Statistic: Average
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1073741824
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: OperationsTopic
      OKActions:
      - Ref: OperationsTopic
      Tags:
      - Key: Project
        Value: INFOSYS735-GP2
      - Key: ManagedBy
        Value: CloudFormation
  BackendRotationLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasBackendRotationCode
    Properties:
      LogGroupName:
        Fn::Sub: /${EnvironmentName}/backend-db-rotation
      RetentionInDays: 7
      Tags:
      - Key: Project
        Value: INFOSYS735-GP2
      - Key: Environment
        Value: LearnerLab
      - Key: ManagedBy
        Value: CloudFormation
  BackendRotationFunction:
    Type: AWS::Lambda::Function
    Condition: HasBackendRotationCode
    Properties:
      FunctionName:
        Fn::Sub: ${EnvironmentName}-backend-db-rotation
      Description: Four-step single-user Oracle rotation; tests SELECT access before promoting AWSCURRENT.
      Runtime: python3.12
      Handler: app.lambda_handler
      Architectures:
      - x86_64
      Role:
        Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${LabRoleName}
      Timeout: 60
      MemorySize: 256
      Code:
        S3Bucket:
          Fn::ImportValue:
            Fn::Sub: ${CoreStackName}-CatalogueImageBucketName
        S3Key:
          Ref: BackendRotationCodeKey
      VpcConfig:
        SecurityGroupIds:
        - Fn::ImportValue:
            Fn::Sub: ${CoreStackName}-BackendSecurityGroupId
        SubnetIds:
        - Fn::ImportValue:
            Fn::Sub: ${NetworkStackName}-PrivateAppSubnetAId
        - Fn::ImportValue:
            Fn::Sub: ${NetworkStackName}-PrivateAppSubnetBId
      Environment:
        Variables:
          APP_SECRET_ARN:
            Fn::ImportValue:
              Fn::Sub: ${CoreStackName}-DatabaseApplicationSecretArn
          DB_HOST:
            Fn::ImportValue:
              Fn::Sub: ${CoreStackName}-DatabaseEndpointAddress
          DB_PORT:
            Fn::ImportValue:
              Fn::Sub: ${CoreStackName}-DatabaseEndpointPort
          DB_NAME:
            Fn::ImportValue:
              Fn::Sub: ${CoreStackName}-DatabaseName
          DB_OWNER:
            Fn::ImportValue:
              Fn::Sub: ${CoreStackName}-DatabaseOwner
      LoggingConfig:
        LogFormat: Text
        LogGroup:
          Ref: BackendRotationLogGroup
      Tags:
      - Key: Project
        Value: INFOSYS735-GP2
      - Key: Environment
        Value: LearnerLab
      - Key: ManagedBy
        Value: CloudFormation
  BackendRotationPermission:
    Type: AWS::Lambda::Permission
    Condition: HasBackendRotationCode
    Properties:
      FunctionName:
        Ref: BackendRotationFunction
      Action: lambda:InvokeFunction
      Principal: secretsmanager.amazonaws.com
      SourceAccount:
        Ref: AWS::AccountId
      SourceArn:
        Fn::ImportValue:
          Fn::Sub: ${CoreStackName}-DatabaseApplicationSecretArn
  BackendRotationSchedule:
    Type: AWS::SecretsManager::RotationSchedule
    Condition: HasBackendRotationCode
    DependsOn:
    - BackendRotationPermission
    Properties:
      SecretId:
        Fn::ImportValue:
          Fn::Sub: ${CoreStackName}-DatabaseApplicationSecretArn
      RotationLambdaARN:
        Fn::GetAtt:
        - BackendRotationFunction
        - Arn
      RotateImmediatelyOnUpdate: true
      RotationRules:
        ScheduleExpression:
          Fn::Sub: rate(${BackendRotationDays} days)
        Duration: 2h
  BackendRotationErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasBackendRotationCode
    Properties:
      AlarmName:
        Fn::Sub: ${EnvironmentName}-backend-db-rotation-errors
      AlarmDescription: 'Rotation Lambda error: inspect rotation metadata/logs; do not edit the password manually.'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
      - Name: FunctionName
        Value:
          Ref: BackendRotationFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: OperationsTopic
      OKActions:
      - Ref: OperationsTopic
      Tags:
      - Key: Project
        Value: INFOSYS735-GP2
      - Key: Environment
        Value: LearnerLab
      - Key: ManagedBy
        Value: CloudFormation
Outputs:
  OperationsTopicArn:
    Description: SNS topic used by CloudWatch alarms.
    Value:
      Ref: OperationsTopic
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-OperationsTopicArn
  FrontendUnhealthyHostAlarmName:
    Value:
      Ref: FrontendUnhealthyHostAlarm
  FrontendInServiceCapacityAlarmName:
    Value:
      Ref: FrontendInServiceCapacityAlarm
  AlbTarget5xxAlarmName:
    Value:
      Ref: AlbTarget5xxAlarm
  BackendUnhealthyHostAlarmName:
    Value:
      Ref: BackendUnhealthyHostAlarm
  BackendInServiceCapacityAlarmName:
    Value:
      Ref: BackendInServiceCapacityAlarm
  DatabaseCpuAlarmName:
    Value:
      Ref: DatabaseCpuAlarm
  DatabaseFreeStorageAlarmName:
    Value:
      Ref: DatabaseFreeStorageAlarm
  BackendRotationFunctionName:
    Condition: HasBackendRotationCode
    Value:
      Ref: BackendRotationFunction
  BackendRotationDays:
    Condition: HasBackendRotationCode
    Value:
      Ref: BackendRotationDays
