AWSTemplateFormatVersion: '2010-09-09'
Description: 'AnyGroupLLC website: private Apache/frontend and Python legacy API across two AZs, private RDS Oracle SE2 Multi-AZ
  with managed credentials, ALBs, scaling and private S3 images. Synthetic data only.'
Parameters:
  EnvironmentName:
    Type: String
    Default: anygroup-gp2
  NetworkStackName:
    Type: String
    Default: anygroup-gp2-network
    Description: Name of the deployed Part 6 network CloudFormation stack.
  ApplicationAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 AMI resolved through AWS public SSM parameter.
  ExistingInstanceProfileName:
    Type: String
    Default: LabInstanceProfile
    Description: Existing AWS Academy Learner Lab instance profile.
  FrontendInstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
    - t3.nano
    - t3.micro
    - t3.small
    - t3.medium
    - t3.large
  BackendInstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
    - t3.nano
    - t3.micro
    - t3.small
    - t3.medium
    - t3.large
  BackendMinSize:
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 2
    Description: Backend ASG minimum; fixed at two for one backend per AZ at steady state.
  BackendDesiredCapacity:
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 2
    Description: Backend ASG desired capacity across the two private app subnets.
  BackendMaxSize:
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 2
    Description: Backend ASG maximum; fixed at two to protect Learner Lab EC2 quota.
  FrontendMinSize:
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 2
  FrontendDesiredCapacity:
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 2
  FrontendMaxSize:
    Type: Number
    Default: 4
    MinValue: 2
    MaxValue: 4
  FrontendRequestCountTarget:
    Type: Number
    Default: 50
    MinValue: 10
    MaxValue: 1000
    Description: |
      Target ALB requests per frontend target per minute. The low Learner Lab default is intentional so scaling can be demonstrated with a small load test.
  DbInstanceClass:
    Type: String
    Default: db.t3.small
    AllowedValues:
    - db.t3.small
    - db.t3.medium
    - db.t3.large
    Description: Setup checks current Oracle SE2 License Included / Multi-AZ availability before deploying.
  DbEngineVersion:
    Type: String
    Default: ''
    Description: Setup resolves an orderable Oracle 19 version. Empty lets RDS choose its default.
  DbAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 100
  DbName:
    Type: String
    Default: ANYGROUP
    AllowedPattern: '[A-Z][A-Z0-9]{0,7}'
  DbMasterUsername:
    Type: String
    Default: anygroupadmin
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9]{0,29}'
Resources:
  PublicAlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public ALB - public HTTP ingress and restricted tier egress
      VpcId:
        Fn::ImportValue:
          Fn::Sub: ${NetworkStackName}-VpcId
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 80
        ToPort: 80
        CidrIp: 0.0.0.0/0
        Description: Public HTTP for Learner Lab demo
      SecurityGroupEgress:
      - IpProtocol: '-1'
        CidrIp: 127.0.0.1/32
        Description: Disable default egress; explicit rules below
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${EnvironmentName}-sg-public-alb
      - Key: Project
        Value: INFOSYS735-GP2
      - Key: Environment
        Value: LearnerLab
      - Key: ManagedBy
        Value: CloudFormation
      - Key: Component
        Value: Core
  InternalAlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Internal ALB - service traffic only from frontend EC2
      VpcId:
        Fn::ImportValue:
          Fn::Sub: ${NetworkStackName}-VpcId
      SecurityGroupIngress: []
      SecurityGroupEgress:
      - IpProtocol: '-1'
        CidrIp: 127.0.0.1/32
        Description: Disable default egress; explicit rules below
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${EnvironmentName}-sg-internal-alb
      - Key: Project
        Value: INFOSYS735-GP2
      - Key: Environment
        Value: LearnerLab
      - Key: ManagedBy
        Value: CloudFormation
      - Key: Component
        Value: Core
  FrontendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Frontend EC2 - HTTP from public ALB and reverse-proxy access to internal ALB
      VpcId:
        Fn::ImportValue:
          Fn::Sub: ${NetworkStackName}-VpcId
      SecurityGroupIngress: []
      SecurityGroupEgress:
      - IpProtocol: '-1'
        CidrIp: 127.0.0.1/32
        Description: Disable default egress; explicit rules below
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${EnvironmentName}-sg-frontend
      - Key: Project
        Value: INFOSYS735-GP2
      - Key: Environment
        Value: LearnerLab
      - Key: ManagedBy
        Value: CloudFormation
      - Key: Component
        Value: Core
  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Legacy backend ASG - API traffic only from internal ALB
      VpcId:
        Fn::ImportValue:
          Fn::Sub: ${NetworkStackName}-VpcId
      SecurityGroupIngress: []
      SecurityGroupEgress:
      - IpProtocol: '-1'
        CidrIp: 127.0.0.1/32
        Description: Disable default egress; explicit rules below
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${EnvironmentName}-sg-backend
      - Key: Project
        Value: INFOSYS735-GP2
      - Key: Environment
        Value: LearnerLab
      - Key: ManagedBy
        Value: CloudFormation
      - Key: Component
        Value: Core
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private RDS Oracle - TCP 1521 only from backend
      VpcId:
        Fn::ImportValue:
          Fn::Sub: ${NetworkStackName}-VpcId
      SecurityGroupIngress: []
      SecurityGroupEgress:
      - IpProtocol: '-1'
        CidrIp: 127.0.0.1/32
        Description: Disable default egress; no routable DB egress
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${EnvironmentName}-sg-db
      - Key: Project
        Value: INFOSYS735-GP2
      - Key: Environment
        Value: LearnerLab
      - Key: ManagedBy
        Value: CloudFormation
      - Key: Component
        Value: Core
  AlbToFrontendEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId:
        Ref: PublicAlbSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      DestinationSecurityGroupId:
        Ref: FrontendSecurityGroup
      Description: ALB to frontend HTTP
  FrontendFromAlbIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Ref: FrontendSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourceSecurityGroupId:
        Ref: PublicAlbSecurityGroup
      Description: Frontend HTTP only from ALB
  InternalAlbFromFrontendIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Ref: InternalAlbSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourceSecurityGroupId:
        Ref: FrontendSecurityGroup
      Description: Frontend EC2 to internal ALB HTTP
  InternalAlbToBackendEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId:
        Ref: InternalAlbSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      DestinationSecurityGroupId:
        Ref: BackendSecurityGroup
      Description: Internal ALB to legacy backend API
  BackendFromInternalAlbIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Ref: BackendSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId:
        Ref: InternalAlbSecurityGroup
      Description: Backend API only from internal ALB
  BackendToDbEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId:
        Ref: BackendSecurityGroup
      IpProtocol: tcp
      FromPort: 1521
      ToPort: 1521
      DestinationSecurityGroupId:
        Ref: DbSecurityGroup
      Description: Backend SQL to private RDS Oracle
  DbFromBackendIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Ref: DbSecurityGroup
      IpProtocol: tcp
      FromPort: 1521
      ToPort: 1521
      SourceSecurityGroupId:
        Ref: BackendSecurityGroup
      Description: DB listener only from backend
  FrontendHttpEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId:
        Ref: FrontendSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: 0.0.0.0/0
      Description: Package installation through NAT
  FrontendHttpsEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId:
        Ref: FrontendSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
      Description: SSM and HTTPS through NAT
  BackendHttpEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId:
        Ref: BackendSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: 0.0.0.0/0
      Description: Package installation through NAT
  BackendHttpsEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId:
        Ref: BackendSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
      Description: SSM and AWS service HTTPS through NAT
  BackendLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName:
        Fn::Sub: ${EnvironmentName}-backend-lt
      LaunchTemplateData:
        ImageId:
          Ref: ApplicationAmiId
        InstanceType:
          Ref: BackendInstanceType
        IamInstanceProfile:
          Name:
            Ref: ExistingInstanceProfileName
        SecurityGroupIds:
        - Ref: BackendSecurityGroup
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
        TagSpecifications:
        - ResourceType: instance
          Tags:
          - Key: Name
            Value:
              Fn::Sub: ${EnvironmentName}-backend
          - Key: Project
            Value: INFOSYS735-GP2
          - Key: Environment
            Value: LearnerLab
          - Key: ManagedBy
            Value: CloudFormation
          - Key: Tier
            Value: Application
        UserData:
          Fn::Base64:
            Fn::Sub: |
              #!/bin/bash
              set -euo pipefail
              dnf install -y aws-cfn-bootstrap python3-pip
              trap '/opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource BackendAutoScalingGroup --region ${AWS::Region}' EXIT
              python3 -m venv /opt/anygroup-backend-venv
              cat > /opt/anygroup-backend-requirements.txt <<'REQ'
              boto3>=1.40,<2
              oracledb>=3.2,<4
              REQ
              /opt/anygroup-backend-venv/bin/pip install -r /opt/anygroup-backend-requirements.txt
              cat > /opt/anygroup_backend.py <<'PY'
              """Synthetic legacy API backed by private RDS Oracle, using a read-only DB user."""
              import argparse
              import json
              import os
              import re
              import threading
              import time
              import urllib.request
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

              import boto3
              from botocore.config import Config
              import oracledb

              REGION = os.getenv("AWS_REGION", "us-east-1")
              OWNER = os.getenv("DB_OWNER", "anygroupadmin").upper()
              _secret_cache = {}
              _lock = threading.Lock()


              def secret(arn, refresh=False):
                  with _lock:
                      cached = _secret_cache.get(arn)
                      if not refresh and cached and time.monotonic() - cached[0] < 60:
                          return cached[1]
                      client = boto3.client("secretsmanager", region_name=REGION,
                                            config=Config(connect_timeout=3, read_timeout=3,
                                                          retries={"max_attempts": 1}))
                      value = json.loads(client.get_secret_value(SecretId=arn)["SecretString"])
                      _secret_cache[arn] = (time.monotonic(), value)
                      return value


              def connect(admin=False):
                  arn = os.environ["DB_MASTER_SECRET_ARN" if admin else "DB_APP_SECRET_ARN"]
                  for attempt in range(2):
                      credentials = secret(arn, refresh=bool(attempt))
                      try:
                          connection = oracledb.connect(
                              user=credentials["username"], password=credentials["password"],
                              host=os.environ["DB_HOST"], port=int(os.getenv("DB_PORT", "1521")),
                              sid=os.getenv("DB_NAME", "ANYGROUP"), tcp_connect_timeout=3,
                              retry_count=0)
                          connection.call_timeout = 5000
                          return connection
                      except oracledb.DatabaseError as exc:
                          if attempt or getattr(exc.args[0], "code", None) != 1017:
                              raise


              def seed_database():
                  """Run explicitly through SSM; application requests never write or use admin credentials."""
                  app = secret(os.environ["DB_APP_SECRET_ARN"], refresh=True)
                  username, password = app["username"].upper(), app["password"]
                  if not re.fullmatch(r"[A-Z][A-Z0-9]{0,29}", username) or not re.fullmatch(r"[a-zA-Z0-9]{20,30}", password):
                      raise ValueError("Unexpected generated application credential format")
                  if not re.fullmatch(r"[A-Z][A-Z0-9]{0,29}", OWNER):
                      raise ValueError("Invalid database owner")
                  with connect(admin=True) as connection:
                      with connection.cursor() as cursor:
                          for ddl in (
                              "CREATE TABLE demo_orders (order_id VARCHAR2(30) PRIMARY KEY, status VARCHAR2(30) NOT NULL)",
                              "CREATE TABLE demo_customers (customer_id VARCHAR2(30) PRIMARY KEY, name VARCHAR2(80), status VARCHAR2(30))",
                          ):
                              try:
                                  cursor.execute(ddl)
                              except oracledb.DatabaseError as exc:
                                  if getattr(exc.args[0], "code", None) != 955:
                                      raise
                          for order_id, status in (("ORD-1001", "Processing"), ("ORD-1002", "Ready")):
                              cursor.execute("MERGE INTO demo_orders d USING (SELECT :id order_id, :status status FROM dual) s "
                                             "ON (d.order_id=s.order_id) WHEN MATCHED THEN UPDATE SET d.status=s.status "
                                             "WHEN NOT MATCHED THEN INSERT (order_id,status) VALUES (s.order_id,s.status)",
                                             id=order_id, status=status)
                          cursor.execute("MERGE INTO demo_customers d USING (SELECT 'CUST-1001' customer_id FROM dual) s "
                                         "ON (d.customer_id=s.customer_id) WHEN NOT MATCHED THEN "
                                         "INSERT (customer_id,name,status) VALUES ('CUST-1001','Demo Customer','Active')")
                          connection.commit()
                          try:
                              cursor.execute(f'CREATE USER {username} IDENTIFIED BY "{password}"')
                          except oracledb.DatabaseError as exc:
                              if getattr(exc.args[0], "code", None) != 1920:
                                  raise
                              cursor.execute(f'ALTER USER {username} IDENTIFIED BY "{password}"')
                          cursor.execute(f"GRANT CREATE SESSION TO {username}")
                          for table in ("DEMO_ORDERS", "DEMO_CUSTOMERS"):
                              cursor.execute(f"GRANT SELECT ON {OWNER}.{table} TO {username}")
                  print(json.dumps({"status": "SEEDED", "engine": "oracle", "orders": 2, "customers": 1,
                                    "application_access": "SELECT_ONLY"}))


              def query(path):
                  with connect() as connection:
                      with connection.cursor() as cursor:
                          if path == "/api/orders":
                              cursor.execute(f"SELECT order_id, status FROM {OWNER}.demo_orders ORDER BY order_id")
                              return {"orders": [{"order_id": row[0], "status": row[1]} for row in cursor.fetchall()]}
                          if path == "/api/account":
                              cursor.execute(f"SELECT name, status FROM {OWNER}.demo_customers WHERE customer_id=:id", id="CUST-1001")
                              row = cursor.fetchone()
                              if row is None:
                                  raise ValueError("Seed customer missing")
                              return {"customer": {"name": row[0], "status": row[1]}}
                          cursor.execute("SELECT 1 FROM dual")
                          accessible = cursor.fetchone()[0] == 1
                          cursor.execute(f"SELECT COUNT(*) FROM {OWNER}.demo_orders")
                          return {"database_tier": "RDS_ORACLE_MULTI_AZ", "database_accessible": accessible,
                                  "seed_order_count": cursor.fetchone()[0], "application_access": "SELECT_ONLY"}


              def metadata(path):
                  try:
                      root = "http://169.254.169.254/latest/"
                      request = urllib.request.Request(root + "api/token", method="PUT",
                                                       headers={"X-aws-ec2-metadata-token-ttl-seconds": "21600"})
                      token = urllib.request.urlopen(request, timeout=1).read().decode()
                      request = urllib.request.Request(root + "meta-data/" + path, headers={"X-aws-ec2-metadata-token": token})
                      return urllib.request.urlopen(request, timeout=1).read().decode()
                  except Exception:
                      return "unknown"


              class Handler(BaseHTTPRequestHandler):
                  def send_json(self, payload, status=200):
                      body = json.dumps(payload).encode()
                      self.send_response(status)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.send_header("Cache-Control", "no-store")
                      self.end_headers()
                      self.wfile.write(body)

                  def do_GET(self):
                      base = {"service": "legacy-backend", **self.server.identity}
                      if self.path == "/api/health":
                          self.send_json({**base, "status": "healthy"})
                      elif self.path in {"/api/db", "/api/orders", "/api/account"}:
                          try:
                              self.send_json({**base, **query(self.path)})
                          except Exception:
                              # Never send/log driver exception text: it can contain sensitive connection details.
                              self.send_json({**base, "error": "database_unavailable"}, 503)
                      else:
                          self.send_json({"error": "not_found"}, 404)


              def main():
                  parser = argparse.ArgumentParser(description=__doc__)
                  parser.add_argument("--seed-db", action="store_true")
                  args = parser.parse_args()
                  if args.seed_db:
                      try:
                          seed_database()
                      except Exception:
                          print(json.dumps({"status": "FAIL", "error": "Database seed failed; check RDS, secrets permissions and connectivity"}))
                          return 1
                      return 0
                  if not re.fullmatch(r"[A-Z][A-Z0-9]{0,29}", OWNER):
                      raise ValueError("Invalid database owner")
                  server = ThreadingHTTPServer(("0.0.0.0", 8080), Handler)
                  server.identity = {"instance_id": metadata("instance-id"), "availability_zone": metadata("placement/availability-zone")}
                  server.serve_forever()


              if __name__ == "__main__":
                  raise SystemExit(main())
              PY
              cat > /etc/anygroup-backend.env <<'ENV'
              AWS_REGION=${AWS::Region}
              DB_HOST=${OracleDatabase.Endpoint.Address}
              DB_PORT=${OracleDatabase.Endpoint.Port}
              DB_NAME=${DbName}
              DB_OWNER=${DbMasterUsername}
              DB_MASTER_SECRET_ARN=${OracleDatabase.MasterUserSecret.SecretArn}
              DB_APP_SECRET_ARN=${BackendDbCredentials}
              ENV
              chmod 600 /etc/anygroup-backend.env
              cat > /etc/systemd/system/anygroup-backend.service <<'UNIT'
              [Unit]
              Description=AnyGroupLLC RDS-backed Legacy Demo API
              After=network-online.target
              Wants=network-online.target
              [Service]
              Type=simple
              EnvironmentFile=/etc/anygroup-backend.env
              ExecStart=/opt/anygroup-backend-venv/bin/python /opt/anygroup_backend.py
              Restart=always
              RestartSec=2
              [Install]
              WantedBy=multi-user.target
              UNIT
              systemctl daemon-reload
              systemctl enable --now anygroup-backend.service
              curl -fsS --retry 20 --retry-delay 2 --retry-connrefused http://127.0.0.1:8080/api/health
      TagSpecifications:
      - ResourceType: launch-template
        Tags:
        - Key: Name
          Value:
            Fn::Sub: ${EnvironmentName}-backend-lt
        - Key: Project
          Value: INFOSYS735-GP2
        - Key: Environment
          Value: LearnerLab
        - Key: ManagedBy
          Value: CloudFormation
  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name:
        Fn::Sub: ${EnvironmentName}-backend-tg
      VpcId:
        Fn::ImportValue:
          Fn::Sub: ${NetworkStackName}-VpcId
      Protocol: HTTP
      Port: 8080
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: /api/health
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      Matcher:
        HttpCode: '200'
      Tags:
      - Key: Project
        Value: INFOSYS735-GP2
      - Key: Environment
        Value: LearnerLab
      - Key: ManagedBy
        Value: CloudFormation
      TargetGroupAttributes:
      - Key: deregistration_delay.timeout_seconds
        Value: '30'
  InternalApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name:
        Fn::Sub: ${EnvironmentName}-internal-alb
      Scheme: internal
      Type: application
      IpAddressType: ipv4
      SecurityGroups:
      - Ref: InternalAlbSecurityGroup
      Subnets:
      - Fn::ImportValue:
          Fn::Sub: ${NetworkStackName}-PrivateAppSubnetAId
      - Fn::ImportValue:
          Fn::Sub: ${NetworkStackName}-PrivateAppSubnetBId
      Tags:
      - Key: Project
        Value: INFOSYS735-GP2
      - Key: Environment
        Value: LearnerLab
      - Key: ManagedBy
        Value: CloudFormation
      - Key: Component
        Value: Core
  InternalHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn:
        Ref: InternalApplicationLoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
      - Type: fixed-response
        FixedResponseConfig:
          StatusCode: '404'
          ContentType: application/json
          MessageBody: '{"error":"route_not_found"}'
  BackendApiInternalListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn:
        Ref: InternalHttpListener
      Priority: 100
      Conditions:
      - Field: path-pattern
        PathPatternConfig:
          Values:
          - /api
          - /api/*
      Actions:
      - Type: forward
        TargetGroupArn:
          Ref: BackendTargetGroup
  BackendAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    CreationPolicy:
      ResourceSignal:
        Count:
          Ref: BackendDesiredCapacity
        Timeout: PT15M
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MaxBatchSize: 1
        MinInstancesInService: 1
        PauseTime: PT10M
        WaitOnResourceSignals: true
        SuspendProcesses:
        - HealthCheck
        - ReplaceUnhealthy
        - AZRebalance
        - AlarmNotification
        - ScheduledActions
    DependsOn:
    - BackendApiInternalListenerRule
    - BackendFromInternalAlbIngress
    - BackendToDbEgress
    - BackendHttpEgress
    - BackendHttpsEgress
    - DbFromBackendIngress
    Properties:
      AutoScalingGroupName:
        Fn::Sub: ${EnvironmentName}-backend-asg
      VPCZoneIdentifier:
      - Fn::ImportValue:
          Fn::Sub: ${NetworkStackName}-PrivateAppSubnetAId
      - Fn::ImportValue:
          Fn::Sub: ${NetworkStackName}-PrivateAppSubnetBId
      LaunchTemplate:
        LaunchTemplateId:
          Ref: BackendLaunchTemplate
        Version:
          Fn::GetAtt:
          - BackendLaunchTemplate
          - LatestVersionNumber
      MinSize:
        Ref: BackendMinSize
      MaxSize:
        Ref: BackendMaxSize
      DesiredCapacity:
        Ref: BackendDesiredCapacity
      HealthCheckType: ELB
      HealthCheckGracePeriod: 180
      DefaultInstanceWarmup: 120
      MetricsCollection:
      - Granularity: 1Minute
        Metrics:
        - GroupDesiredCapacity
        - GroupInServiceInstances
        - GroupPendingInstances
        - GroupTerminatingInstances
        - GroupTotalInstances
      TargetGroupARNs:
      - Ref: BackendTargetGroup
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${EnvironmentName}-backend
        PropagateAtLaunch: true
      - Key: Project
        Value: INFOSYS735-GP2
        PropagateAtLaunch: true
      - Key: ManagedBy
        Value: CloudFormation
        PropagateAtLaunch: true
  FrontendLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName:
        Fn::Sub: ${EnvironmentName}-frontend-lt
      LaunchTemplateData:
        ImageId:
          Ref: ApplicationAmiId
        InstanceType:
          Ref: FrontendInstanceType
        IamInstanceProfile:
          Name:
            Ref: ExistingInstanceProfileName
        SecurityGroupIds:
        - Ref: FrontendSecurityGroup
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
        TagSpecifications:
        - ResourceType: instance
          Tags:
          - Key: Name
            Value:
              Fn::Sub: ${EnvironmentName}-frontend
          - Key: Project
            Value: INFOSYS735-GP2
          - Key: Environment
            Value: LearnerLab
          - Key: ManagedBy
            Value: CloudFormation
          - Key: Tier
            Value: Web
        UserData:
          Fn::Base64:
            Fn::Sub:
            - |
              #!/bin/bash
              set -euo pipefail

              dnf install -y httpd aws-cfn-bootstrap
              trap '/opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource FrontendAutoScalingGroup --region ${AWS::Region}' EXIT
              systemctl enable httpd

              TOKEN=$(curl -fsS --connect-timeout 2 --max-time 5 -X PUT \
                -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" \
                http://169.254.169.254/latest/api/token)

              INSTANCE_ID=$(curl -fsS --connect-timeout 2 --max-time 5 \
                -H "X-aws-ec2-metadata-token: $TOKEN" \
                http://169.254.169.254/latest/meta-data/instance-id)

              AZ=$(curl -fsS --connect-timeout 2 --max-time 5 \
                -H "X-aws-ec2-metadata-token: $TOKEN" \
                http://169.254.169.254/latest/meta-data/placement/availability-zone)

              cat > /etc/httpd/conf.d/anygroup-proxy.conf <<EOF
              ProxyRequests Off
              ProxyPreserveHost On

              ProxyPass        /api/        http://${InternalAlbDns}/api/
              ProxyPassReverse /api/        http://${InternalAlbDns}/api/

              ProxyPass        /catalogue/  http://${InternalAlbDns}/catalogue/
              ProxyPassReverse /catalogue/  http://${InternalAlbDns}/catalogue/
              EOF

              # FRONTEND_HTML_START
              base64 -d <<'HTML_GZIP' | gzip -dc > /var/www/html/index.html
              
              HTML_GZIP
              sed "s/__INSTANCE_ID__/$INSTANCE_ID/g; s/__AZ__/$AZ/g" /var/www/html/index.html > /var/www/html/index.tmp
              mv /var/www/html/index.tmp /var/www/html/index.html
              # FRONTEND_HTML_END

              systemctl restart httpd
              curl -fsS --retry 20 --retry-delay 2 --retry-connrefused http://127.0.0.1/
            - InternalAlbDns:
                Fn::GetAtt:
                - InternalApplicationLoadBalancer
                - DNSName
      TagSpecifications:
      - ResourceType: launch-template
        Tags:
        - Key: Name
          Value:
            Fn::Sub: ${EnvironmentName}-frontend-lt
        - Key: Project
          Value: INFOSYS735-GP2
        - Key: ManagedBy
          Value: CloudFormation
  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name:
        Fn::Sub: ${EnvironmentName}-web-tg
      VpcId:
        Fn::ImportValue:
          Fn::Sub: ${NetworkStackName}-VpcId
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: /
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
      - Key: deregistration_delay.timeout_seconds
        Value: '30'
      Tags:
      - Key: Project
        Value: INFOSYS735-GP2
      - Key: Environment
        Value: LearnerLab
      - Key: ManagedBy
        Value: CloudFormation
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name:
        Fn::Sub: ${EnvironmentName}-alb
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups:
      - Ref: PublicAlbSecurityGroup
      Subnets:
      - Fn::ImportValue:
          Fn::Sub: ${NetworkStackName}-PublicSubnetAId
      - Fn::ImportValue:
          Fn::Sub: ${NetworkStackName}-PublicSubnetBId
      Tags:
      - Key: Project
        Value: INFOSYS735-GP2
      - Key: Environment
        Value: LearnerLab
      - Key: ManagedBy
        Value: CloudFormation
      - Key: Component
        Value: Core
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn:
        Ref: ApplicationLoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
      - Type: forward
        TargetGroupArn:
          Ref: FrontendTargetGroup
  FrontendAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    CreationPolicy:
      ResourceSignal:
        Count:
          Ref: FrontendDesiredCapacity
        Timeout: PT15M
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MaxBatchSize: 1
        MinInstancesInService: 1
        PauseTime: PT10M
        WaitOnResourceSignals: true
        SuspendProcesses:
        - HealthCheck
        - ReplaceUnhealthy
        - AZRebalance
        - AlarmNotification
        - ScheduledActions
    DependsOn:
    - HttpListener
    - AlbToFrontendEgress
    - FrontendFromAlbIngress
    - InternalAlbFromFrontendIngress
    - FrontendHttpEgress
    - FrontendHttpsEgress
    Properties:
      AutoScalingGroupName:
        Fn::Sub: ${EnvironmentName}-frontend-asg
      VPCZoneIdentifier:
      - Fn::ImportValue:
          Fn::Sub: ${NetworkStackName}-PrivateAppSubnetAId
      - Fn::ImportValue:
          Fn::Sub: ${NetworkStackName}-PrivateAppSubnetBId
      LaunchTemplate:
        LaunchTemplateId:
          Ref: FrontendLaunchTemplate
        Version:
          Fn::GetAtt:
          - FrontendLaunchTemplate
          - LatestVersionNumber
      MinSize:
        Ref: FrontendMinSize
      MaxSize:
        Ref: FrontendMaxSize
      DesiredCapacity:
        Ref: FrontendDesiredCapacity
      HealthCheckType: ELB
      HealthCheckGracePeriod: 180
      DefaultInstanceWarmup: 120
      MetricsCollection:
      - Granularity: 1Minute
        Metrics:
        - GroupDesiredCapacity
        - GroupInServiceInstances
        - GroupPendingInstances
        - GroupTerminatingInstances
        - GroupTotalInstances
      TargetGroupARNs:
      - Ref: FrontendTargetGroup
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${EnvironmentName}-frontend
        PropagateAtLaunch: true
      - Key: Project
        Value: INFOSYS735-GP2
        PropagateAtLaunch: true
      - Key: ManagedBy
        Value: CloudFormation
        PropagateAtLaunch: true
  FrontendRequestCountScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    DependsOn:
    - HttpListener
    Properties:
      AutoScalingGroupName:
        Ref: FrontendAutoScalingGroup
      PolicyType: TargetTrackingScaling
      EstimatedInstanceWarmup: 120
      TargetTrackingConfiguration:
        DisableScaleIn: false
        TargetValue:
          Ref: FrontendRequestCountTarget
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel:
            Fn::Join:
            - /
            - - Fn::GetAtt:
                - ApplicationLoadBalancer
                - LoadBalancerFullName
              - Fn::GetAtt:
                - FrontendTargetGroup
                - TargetGroupFullName
  CatalogueImageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
        - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${EnvironmentName}-catalogue-images
      - Key: Project
        Value: INFOSYS735-GP2
      - Key: Environment
        Value: LearnerLab
      - Key: ManagedBy
        Value: CloudFormation
      - Key: Component
        Value: Core
      - Key: Purpose
        Value: CatalogueImages
  CatalogueImageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: CatalogueImageBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: DenyInsecureTransport
          Effect: Deny
          Principal: '*'
          Action: s3:*
          Resource:
          - Fn::GetAtt:
            - CatalogueImageBucket
            - Arn
          - Fn::Sub:
            - ${BucketArn}/*
            - BucketArn:
                Fn::GetAtt:
                - CatalogueImageBucket
                - Arn
          Condition:
            Bool:
              aws:SecureTransport: false
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private DB subnets across two AZs
      SubnetIds:
      - Fn::ImportValue:
          Fn::Sub: ${NetworkStackName}-PrivateDbSubnetAId
      - Fn::ImportValue:
          Fn::Sub: ${NetworkStackName}-PrivateDbSubnetBId
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${EnvironmentName}-rds-subnets
      - Key: Project
        Value: INFOSYS735-GP2
      - Key: Environment
        Value: LearnerLab
      - Key: ManagedBy
        Value: CloudFormation
      - Key: Component
        Value: Database
  BackendDbCredentials:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name:
        Fn::Sub: ${EnvironmentName}/backend-db
      Description: Synthetic backend read-only Oracle application user
      GenerateSecretString:
        SecretStringTemplate: '{"username":"anygroupapp"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: true
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${EnvironmentName}-backend-db-credentials
      - Key: Project
        Value: INFOSYS735-GP2
      - Key: Environment
        Value: LearnerLab
      - Key: ManagedBy
        Value: CloudFormation
      - Key: Component
        Value: Database
  OracleDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier:
        Fn::Sub: ${EnvironmentName}-rds-oracle
      Engine: oracle-se2
      EngineVersion:
        Fn::If:
        - HasDbEngineVersion
        - Ref: DbEngineVersion
        - Ref: AWS::NoValue
      LicenseModel: license-included
      DBInstanceClass:
        Ref: DbInstanceClass
      AllocatedStorage:
        Ref: DbAllocatedStorage
      StorageType: gp2
      StorageEncrypted: true
      MultiAZ: true
      DBName:
        Ref: DbName
      MasterUsername:
        Ref: DbMasterUsername
      ManageMasterUserPassword: true
      Port: '1521'
      DBSubnetGroupName:
        Ref: DbSubnetGroup
      VPCSecurityGroups:
      - Ref: DbSecurityGroup
      PubliclyAccessible: false
      BackupRetentionPeriod: 1
      CopyTagsToSnapshot: true
      DeleteAutomatedBackups: true
      DeletionProtection: false
      AutoMinorVersionUpgrade: true
      MonitoringInterval: 0
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${EnvironmentName}-rds-oracle
      - Key: Project
        Value: INFOSYS735-GP2
      - Key: Environment
        Value: LearnerLab
      - Key: ManagedBy
        Value: CloudFormation
      - Key: Component
        Value: Database
Outputs:
  AlbDnsName:
    Description: Open this DNS name in a browser for the live demo.
    Value:
      Fn::GetAtt:
      - ApplicationLoadBalancer
      - DNSName
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-AlbDnsName
  AlbArn:
    Value:
      Ref: ApplicationLoadBalancer
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-AlbArn
  AlbFullName:
    Description: Application Load Balancer full name used by CloudWatch dimensions.
    Value:
      Fn::GetAtt:
      - ApplicationLoadBalancer
      - LoadBalancerFullName
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-AlbFullName
  PublicAlbSecurityGroupId:
    Value:
      Ref: PublicAlbSecurityGroup
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-PublicAlbSecurityGroupId
  HttpListenerArn:
    Value:
      Ref: HttpListener
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-HttpListenerArn
  FrontendTargetGroupArn:
    Value:
      Ref: FrontendTargetGroup
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-FrontendTargetGroupArn
  FrontendTargetGroupFullName:
    Description: Frontend target group full name used by CloudWatch dimensions.
    Value:
      Fn::GetAtt:
      - FrontendTargetGroup
      - TargetGroupFullName
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-FrontendTargetGroupFullName
  BackendTargetGroupArn:
    Value:
      Ref: BackendTargetGroup
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-BackendTargetGroupArn
  BackendTargetGroupFullName:
    Description: Backend target group full name for monitoring and later diagnostics.
    Value:
      Fn::GetAtt:
      - BackendTargetGroup
      - TargetGroupFullName
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-BackendTargetGroupFullName
  FrontendSecurityGroupId:
    Value:
      Ref: FrontendSecurityGroup
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-FrontendSecurityGroupId
  BackendSecurityGroupId:
    Value:
      Ref: BackendSecurityGroup
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-BackendSecurityGroupId
  DbSecurityGroupId:
    Value:
      Ref: DbSecurityGroup
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-DbSecurityGroupId
  FrontendAutoScalingGroupName:
    Value:
      Ref: FrontendAutoScalingGroup
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-FrontendAutoScalingGroupName
  FrontendScalingPolicyArn:
    Value:
      Ref: FrontendRequestCountScalingPolicy
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-FrontendScalingPolicyArn
  FrontendRequestCountTarget:
    Value:
      Ref: FrontendRequestCountTarget
  CatalogueImageBucketName:
    Description: Private S3 bucket used for catalogue product images and demo objects.
    Value:
      Ref: CatalogueImageBucket
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-CatalogueImageBucketName
  CatalogueImageBucketArn:
    Description: ARN of the private catalogue image bucket.
    Value:
      Fn::GetAtt:
      - CatalogueImageBucket
      - Arn
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-CatalogueImageBucketArn
  InternalAlbDnsName:
    Description: Internal ALB DNS used by frontend reverse proxy.
    Value:
      Fn::GetAtt:
      - InternalApplicationLoadBalancer
      - DNSName
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-InternalAlbDnsName
  InternalAlbArn:
    Value:
      Ref: InternalApplicationLoadBalancer
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-InternalAlbArn
  InternalAlbFullName:
    Value:
      Fn::GetAtt:
      - InternalApplicationLoadBalancer
      - LoadBalancerFullName
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-InternalAlbFullName
  InternalAlbSecurityGroupId:
    Value:
      Ref: InternalAlbSecurityGroup
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-InternalAlbSecurityGroupId
  InternalHttpListenerArn:
    Value:
      Ref: InternalHttpListener
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-InternalHttpListenerArn
  BackendAutoScalingGroupName:
    Value:
      Ref: BackendAutoScalingGroup
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-BackendAutoScalingGroupName
  DatabaseInstanceIdentifier:
    Value:
      Ref: OracleDatabase
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-DatabaseInstanceIdentifier
  DatabaseEndpointAddress:
    Value:
      Fn::GetAtt:
      - OracleDatabase
      - Endpoint.Address
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-DatabaseEndpointAddress
  DatabaseEndpointPort:
    Value:
      Fn::GetAtt:
      - OracleDatabase
      - Endpoint.Port
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-DatabaseEndpointPort
  DatabaseName:
    Value:
      Ref: DbName
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-DatabaseName
  DatabaseMasterSecretArn:
    Value:
      Fn::GetAtt:
      - OracleDatabase
      - MasterUserSecret.SecretArn
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-DatabaseMasterSecretArn
  DatabaseApplicationSecretArn:
    Value:
      Ref: BackendDbCredentials
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-DatabaseApplicationSecretArn
Conditions:
  HasDbEngineVersion:
    Fn::Not:
    - Fn::Equals:
      - Ref: DbEngineVersion
      - ''
